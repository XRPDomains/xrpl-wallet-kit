<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1a2030"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#172035"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="640" height="540" fill="url(#bg)"/>
  <rect width="640" height="540" fill="#000" opacity="0.4"/>

  <!-- Account panel (280px) -->
  <rect x="180" y="40" width="280" height="440" rx="18" fill="url(#panel)" stroke="#2d3f5e" stroke-width="1" filter="url(#sh)"/>

  <!-- Avatar + account name -->
  <circle cx="320" cy="90" r="28" fill="#1e3a6e" stroke="#2d5080" stroke-width="2"/>
  <text x="320" y="97" font-size="20" fill="#60a5fa" text-anchor="middle" font-weight="700">R</text>

  <text x="320" y="134" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">Redstone.xrp</text>
  <text x="320" y="150" font-size="11" fill="#64748b" text-anchor="middle">rBKPS4oLSaV2KVVuHH8EpS…</text>
  <!-- Balance -->
  <text x="320" y="174" font-size="20" font-weight="800" fill="#f1f5f9" text-anchor="middle">1,240.50 XRP</text>
  <text x="320" y="190" font-size="11" fill="#64748b" text-anchor="middle">≈ $682.28 USD · Mainnet</text>

  <!-- Action buttons row -->
  <rect x="200" y="202" width="72" height="30" rx="8" fill="#1e3354" stroke="#2d4a7a" stroke-width="1"/>
  <text x="236" y="222" font-size="11" fill="#94a3b8" text-anchor="middle">📋 Copy</text>
  <rect x="280" y="202" width="80" height="30" rx="8" fill="#1e3354" stroke="#2d4a7a" stroke-width="1"/>
  <text x="320" y="222" font-size="11" fill="#94a3b8" text-anchor="middle">🔗 Explorer</text>
  <rect x="368" y="202" width="92" height="30" rx="8" fill="#1e3354" stroke="#2d4a7a" stroke-width="1"/>
  <text x="414" y="222" font-size="11" fill="#f87171" text-anchor="middle">⏏ Disconnect</text>

  <line x1="196" y1="244" x2="444" y2="244" stroke="#243047" stroke-width="1"/>

  <!-- RECENT TRANSACTIONS SECTION (additive) -->
  <text x="200" y="262" font-size="11" fill="#64748b" font-weight="600" letter-spacing="0.8">RECENT</text>

  <!-- TX Row 1: PENDING -->
  <rect x="196" y="270" width="248" height="42" rx="8" fill="#111f33" stroke="#1e293b" stroke-width="1"/>
  <!-- Pulse dot -->
  <circle cx="214" cy="291" r="6" fill="#3b82f6" opacity="0.2"/>
  <circle cx="214" cy="291" r="4" fill="#3b82f6"/>
  <text x="226" y="285" font-size="11" font-weight="600" fill="#e2e8f0">Send 50 XRP</text>
  <text x="226" y="300" font-size="10" fill="#64748b">to rPT1…3kXa · just now</text>
  <text x="434" y="289" font-size="11" fill="#3b82f6" text-anchor="end">Pending</text>
  <text x="434" y="303" font-size="10" fill="#3b82f6" text-anchor="end">−50 XRP</text>

  <!-- TX Row 2: CONFIRMED -->
  <rect x="196" y="318" width="248" height="42" rx="8" fill="#111f33" stroke="#1e293b" stroke-width="1"/>
  <circle cx="214" cy="339" r="6" fill="#10b981" opacity="0.2"/>
  <circle cx="214" cy="339" r="4" fill="#10b981"/>
  <text x="226" y="333" font-size="11" font-weight="600" fill="#e2e8f0">Receive USDT</text>
  <text x="226" y="348" font-size="10" fill="#64748b">from rXYZ…Aa9 · 2h ago</text>
  <text x="434" y="337" font-size="11" fill="#10b981" text-anchor="end">Confirmed</text>
  <text x="434" y="351" font-size="10" fill="#10b981" text-anchor="end">+100 USDT</text>

  <!-- TX Row 3: FAILED -->
  <rect x="196" y="366" width="248" height="42" rx="8" fill="#111f33" stroke="#1e293b" stroke-width="1"/>
  <circle cx="214" cy="387" r="6" fill="#ef4444" opacity="0.15"/>
  <circle cx="214" cy="387" r="4" fill="#ef4444"/>
  <text x="226" y="381" font-size="11" font-weight="600" fill="#e2e8f0">Send XRP</text>
  <text x="226" y="396" font-size="10" fill="#64748b">tecNO_DST · 5h ago</text>
  <text x="434" y="385" font-size="11" fill="#ef4444" text-anchor="end">Failed</text>
  <text x="434" y="399" font-size="10" fill="#ef4444" text-anchor="end">−0 XRP</text>

  <!-- TX Row 4: CONFIRMED -->
  <rect x="196" y="414" width="248" height="42" rx="8" fill="#111f33" stroke="#1e293b" stroke-width="1"/>
  <circle cx="214" cy="435" r="6" fill="#10b981" opacity="0.2"/>
  <circle cx="214" cy="435" r="4" fill="#10b981"/>
  <text x="226" y="429" font-size="11" font-weight="600" fill="#e2e8f0">OfferCreate</text>
  <text x="226" y="444" font-size="10" fill="#64748b">DEX trade · 1d ago</text>
  <text x="434" y="433" font-size="11" fill="#10b981" text-anchor="end">Confirmed</text>
  <text x="434" y="447" font-size="10" fill="#64748b" text-anchor="end">trade</text>

  <!-- View all -->
  <text x="320" y="472" font-size="11" fill="#60a5fa" text-anchor="middle">View all on Explorer →</text>

  <!-- Close -->
  <circle cx="448" cy="62" r="12" fill="#243047"/>
  <text x="448" y="68" font-size="13" fill="#64748b" text-anchor="middle">✕</text>

  <!-- ANNOTATIONS LEFT -->
  <text x="12" y="66" font-size="10" fill="#3b82f6" font-weight="600">① ACCOUNT HEADER</text>
  <text x="12" y="80" font-size="9.5" fill="#64748b">avatar gradient từ address</text>
  <text x="12" y="93" font-size="9.5" fill="#64748b">balance fetch async</text>
  <line x1="163" y1="76" x2="179" y2="90" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="12" y="254" font-size="10" fill="#3b82f6" font-weight="600">② RECENT SECTION</text>
  <text x="12" y="268" font-size="9.5" fill="#64748b">Additive — append sau</text>
  <text x="12" y="281" font-size="9.5" fill="#64748b">renderPanelContent()</text>
  <text x="12" y="294" font-size="9.5" fill="#64748b">max 5 rows, scroll nếu nhiều</text>
  <line x1="163" y1="268" x2="179" y2="262" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="12" y="340" font-size="10" fill="#3b82f6" font-weight="600">③ TX STATUS DOTS</text>
  <text x="12" y="354" font-size="9.5" fill="#64748b">pending: pulse blink 1.5s</text>
  <text x="12" y="367" font-size="9.5" fill="#64748b">confirmed: static green</text>
  <text x="12" y="380" font-size="9.5" fill="#64748b">failed: static red</text>
  <line x1="163" y1="358" x2="179" y2="339" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ANNOTATIONS RIGHT -->
  <text x="476" y="220" font-size="10" fill="#3b82f6" font-weight="600">④ ACTION BUTTONS</text>
  <text x="476" y="234" font-size="9.5" fill="#64748b">icon + label</text>
  <text x="476" y="247" font-size="9.5" fill="#64748b">32px height</text>
  <text x="476" y="260" font-size="9.5" fill="#64748b">hover: bg brighten</text>
  <line x1="469" y1="218" x2="461" y2="218" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="476" y="300" font-size="10" fill="#3b82f6" font-weight="600">⑤ TX ROW TAP</text>
  <text x="476" y="314" font-size="9.5" fill="#64748b">tap → open explorer</text>
  <text x="476" y="327" font-size="9.5" fill="#64748b">getExplorerTxUrl(hash)</text>
  <text x="476" y="340" font-size="9.5" fill="#64748b">hover: bg #1e2d47</text>
  <line x1="469" y1="310" x2="444" y2="340" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- SPEC BOX -->
  <rect x="12" y="492" width="616" height="40" rx="8" fill="#0d1520" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="508" font-size="10" fill="#475569" font-weight="700" letter-spacing="0.8">INTEGRATION SPEC</text>
  <text x="28" y="524" font-size="10" fill="#94a3b8">Prop: <tspan fill="#e2e8f0">recentTxs?: TxResult[]</tspan>  ·  Inject cuối renderPanelContent()  ·  max-height scroll container  ·  click → getExplorerTxUrl()</text>
</svg>
