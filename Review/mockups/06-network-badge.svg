<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1a2030"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="glow-green"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10b981" flood-opacity="0.6"/></filter>
    <filter id="glow-amber"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.6"/></filter>
    <filter id="glow-sky"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.6"/></filter>
    <filter id="glow-violet"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#a78bfa" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="640" height="500" fill="url(#bg)"/>
  <text x="28" y="36" font-size="11" fill="#64748b" font-weight="500" letter-spacing="1.5">ENHANCED NETWORK BADGE — CONNECT BUTTON</text>
  <line x1="28" y1="44" x2="612" y2="44" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== 5 BUTTON VARIANTS ===== -->

  <!-- 1. MAINNET — no badge -->
  <text x="28" y="80" font-size="10" fill="#10b981" font-weight="600">① MAINNET  (no badge — clean)</text>
  <rect x="28" y="88" width="200" height="44" rx="12" fill="#1e293b" stroke="#2d4a7a" stroke-width="1" filter="url(#sh)"/>
  <circle cx="52" cy="110" r="14" fill="#1e3a6e"/>
  <text x="52" y="115" font-size="10" fill="#60a5fa" text-anchor="middle" font-weight="700">R</text>
  <text x="72" y="106" font-size="12" font-weight="600" fill="#f1f5f9">Redstone.xrp</text>
  <text x="72" y="121" font-size="10" fill="#64748b">rBKPS4…H8EpS</text>
  <text x="216" y="115" font-size="16" fill="#64748b" text-anchor="end">⌄</text>
  <!-- No badge = mainnet is default, no noise -->
  <text x="240" y="96" font-size="9.5" fill="#64748b">Không hiển thị badge</text>
  <text x="240" y="109" font-size="9.5" fill="#64748b">khi ở Mainnet —</text>
  <text x="240" y="122" font-size="9.5" fill="#64748b">giảm visual noise</text>

  <!-- 2. TESTNET — amber -->
  <text x="28" y="162" font-size="10" fill="#f59e0b" font-weight="600">② TESTNET  (amber warning)</text>
  <rect x="28" y="170" width="200" height="44" rx="12" fill="#1e293b" stroke="#2d4a7a" stroke-width="1" filter="url(#sh)"/>
  <circle cx="52" cy="192" r="14" fill="#1e3a6e"/>
  <text x="52" y="197" font-size="10" fill="#60a5fa" text-anchor="middle" font-weight="700">R</text>
  <text x="72" y="188" font-size="12" font-weight="600" fill="#f1f5f9">Redstone.xrp</text>
  <text x="72" y="203" font-size="10" fill="#64748b">rBKPS4…H8EpS</text>
  <text x="216" y="197" font-size="16" fill="#64748b" text-anchor="end">⌄</text>
  <!-- Testnet badge -->
  <rect x="72" y="171" width="56" height="16" rx="8" fill="#92400e" opacity="0.35"/>
  <circle cx="84" cy="179" r="3.5" fill="#f59e0b" filter="url(#glow-amber)"/>
  <text x="116" y="183" font-size="9" fill="#fbbf24" text-anchor="middle" font-weight="600">TESTNET</text>
  <text x="240" y="178" font-size="9.5" fill="#64748b">Amber dot + label</text>
  <text x="240" y="191" font-size="9.5" fill="#64748b">positioned: top-right</text>
  <text x="240" y="204" font-size="9.5" fill="#64748b">của avatar</text>

  <!-- 3. DEVNET — sky blue -->
  <text x="28" y="244" font-size="10" fill="#38bdf8" font-weight="600">③ DEVNET  (sky blue)</text>
  <rect x="28" y="252" width="200" height="44" rx="12" fill="#1e293b" stroke="#2d4a7a" stroke-width="1" filter="url(#sh)"/>
  <circle cx="52" cy="274" r="14" fill="#1e3a6e"/>
  <text x="52" y="279" font-size="10" fill="#60a5fa" text-anchor="middle" font-weight="700">R</text>
  <text x="72" y="270" font-size="12" font-weight="600" fill="#f1f5f9">Redstone.xrp</text>
  <text x="72" y="285" font-size="10" fill="#64748b">rBKPS4…H8EpS</text>
  <text x="216" y="279" font-size="16" fill="#64748b" text-anchor="end">⌄</text>
  <rect x="72" y="253" width="54" height="16" rx="8" fill="#0c4a6e" opacity="0.5"/>
  <circle cx="84" cy="261" r="3.5" fill="#38bdf8" filter="url(#glow-sky)"/>
  <text x="114" y="265" font-size="9" fill="#7dd3fc" text-anchor="middle" font-weight="600">DEVNET</text>
  <text x="240" y="260" font-size="9.5" fill="#64748b">Sky blue dot</text>
  <text x="240" y="273" font-size="9.5" fill="#64748b">developers dễ nhận biết</text>
  <text x="240" y="286" font-size="9.5" fill="#64748b">môi trường dev</text>

  <!-- 4. XRPL EVM — violet -->
  <text x="28" y="326" font-size="10" fill="#a78bfa" font-weight="600">④ XRPL EVM  (violet)</text>
  <rect x="28" y="334" width="200" height="44" rx="12" fill="#1e293b" stroke="#2d4a7a" stroke-width="1" filter="url(#sh)"/>
  <circle cx="52" cy="356" r="14" fill="#1e3a6e"/>
  <text x="52" y="361" font-size="10" fill="#60a5fa" text-anchor="middle" font-weight="700">R</text>
  <text x="72" y="352" font-size="12" font-weight="600" fill="#f1f5f9">0x3f4a…8Bc2</text>
  <text x="72" y="367" font-size="10" fill="#64748b">EVM Sidechain</text>
  <text x="216" y="361" font-size="16" fill="#64748b" text-anchor="end">⌄</text>
  <rect x="72" y="335" width="60" height="16" rx="8" fill="#4c1d95" opacity="0.4"/>
  <circle cx="84" cy="343" r="3.5" fill="#a78bfa" filter="url(#glow-violet)"/>
  <text x="118" y="347" font-size="9" fill="#c4b5fd" text-anchor="middle" font-weight="600">EVM</text>
  <text x="240" y="342" font-size="9.5" fill="#64748b">Violet — phân biệt với</text>
  <text x="240" y="355" font-size="9.5" fill="#64748b">XRPL Mainnet rõ ràng</text>
  <text x="240" y="368" font-size="9.5" fill="#64748b">EVM address 0x…</text>

  <!-- 5. CUSTOM — grey -->
  <text x="28" y="408" font-size="10" fill="#94a3b8" font-weight="600">⑤ CUSTOM RPC  (grey)</text>
  <rect x="28" y="416" width="200" height="44" rx="12" fill="#1e293b" stroke="#2d4a7a" stroke-width="1" filter="url(#sh)"/>
  <circle cx="52" cy="438" r="14" fill="#1e3a6e"/>
  <text x="52" y="443" font-size="10" fill="#60a5fa" text-anchor="middle" font-weight="700">R</text>
  <text x="72" y="434" font-size="12" font-weight="600" fill="#f1f5f9">Redstone.xrp</text>
  <text x="72" y="449" font-size="10" fill="#64748b">rBKPS4…H8EpS</text>
  <text x="216" y="443" font-size="16" fill="#64748b" text-anchor="end">⌄</text>
  <rect x="72" y="417" width="56" height="16" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <circle cx="84" cy="425" r="3.5" fill="#94a3b8"/>
  <text x="116" y="429" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="600">CUSTOM</text>
  <text x="240" y="424" font-size="9.5" fill="#64748b">Grey neutral — unknown</text>
  <text x="240" y="437" font-size="9.5" fill="#64748b">custom RPC config</text>
  <text x="240" y="450" font-size="9.5" fill="#64748b">network.label hiển thị</text>

  <!-- RIGHT SIDE: Effect detail panel -->
  <rect x="430" y="60" width="196" height="380" rx="14" fill="#0d1520" stroke="#1e293b" stroke-width="1"/>
  <text x="528" y="82" font-size="10.5" fill="#475569" font-weight="700" text-anchor="middle" letter-spacing="0.8">ANIMATION SPEC</text>
  <line x1="444" y1="90" x2="612" y2="90" stroke="#1e293b" stroke-width="1"/>

  <text x="444" y="108" font-size="10" fill="#64748b" font-weight="600">Badge appear:</text>
  <text x="444" y="122" font-size="9.5" fill="#94a3b8">scale(0) → scale(1)</text>
  <text x="444" y="135" font-size="9.5" fill="#94a3b8">200ms spring bounce</text>
  <line x1="444" y1="145" x2="612" y2="145" stroke="#1e293b" stroke-width="1"/>

  <text x="444" y="163" font-size="10" fill="#64748b" font-weight="600">Network change:</text>
  <text x="444" y="177" font-size="9.5" fill="#94a3b8">badge fadeOut 150ms</text>
  <text x="444" y="190" font-size="9.5" fill="#94a3b8">→ swap color</text>
  <text x="444" y="203" font-size="9.5" fill="#94a3b8">→ fadeIn 150ms</text>
  <line x1="444" y1="213" x2="612" y2="213" stroke="#1e293b" stroke-width="1"/>

  <text x="444" y="231" font-size="10" fill="#64748b" font-weight="600">Dot pulse:</text>
  <text x="444" y="245" font-size="9.5" fill="#94a3b8">opacity 1 → 0.4 → 1</text>
  <text x="444" y="258" font-size="9.5" fill="#94a3b8">2s ease-in-out infinite</text>
  <text x="444" y="271" font-size="9.5" fill="#94a3b8">(testnet + devnet only)</text>
  <line x1="444" y1="281" x2="612" y2="281" stroke="#1e293b" stroke-width="1"/>

  <text x="444" y="299" font-size="10" fill="#64748b" font-weight="600">Tooltip on hover:</text>
  <text x="444" y="313" font-size="9.5" fill="#94a3b8">full network name +</text>
  <text x="444" y="326" font-size="9.5" fill="#94a3b8">rpcUrl truncated</text>
  <text x="444" y="339" font-size="9.5" fill="#94a3b8">fadeIn 120ms delay 400ms</text>
  <line x1="444" y1="349" x2="612" y2="349" stroke="#1e293b" stroke-width="1"/>

  <text x="444" y="367" font-size="10" fill="#64748b" font-weight="600">Contrast check:</text>
  <text x="444" y="381" font-size="9.5" fill="#94a3b8">Amber: 5.01:1 ✓ AA</text>
  <text x="444" y="394" font-size="9.5" fill="#94a3b8">Sky: 4.82:1 ✓ AA</text>
  <text x="444" y="407" font-size="9.5" fill="#94a3b8">Violet: 4.54:1 ✓ AA</text>
  <text x="444" y="420" font-size="9.5" fill="#94a3b8">Grey: 4.51:1 ✓ AA</text>
  <line x1="444" y1="430" x2="612" y2="430" stroke="#1e293b" stroke-width="1"/>
  <text x="528" y="446" font-size="9" fill="#475569" text-anchor="middle">WCAG 2.1 AA ✓</text>

  <!-- SPEC BOX BOTTOM -->
  <rect x="28" y="470" width="396" height="22" rx="6" fill="#0d1520" stroke="#1e293b" stroke-width="1"/>
  <text x="36" y="485" font-size="9.5" fill="#94a3b8">Logic: isMainnet → no badge  ·  resolveNetworkBadge(network) → { label, color, dot }  ·  inject vào button.ts renderButton()</text>
</svg>
