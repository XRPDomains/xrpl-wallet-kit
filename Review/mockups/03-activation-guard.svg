<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1a2030"/>
    </linearGradient>
    <linearGradient id="modal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#172035"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1f00"/><stop offset="100%" stop-color="#1a1200"/>
    </linearGradient>
    <linearGradient id="qrbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="20" stdDeviation="40" flood-color="#000" flood-opacity="0.7"/></filter>
    <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.4"/></filter>
  </defs>

  <rect width="640" height="560" fill="url(#bg)"/>
  <rect width="640" height="560" fill="#000" opacity="0.55"/>

  <!-- Modal -->
  <rect x="170" y="50" width="300" height="450" rx="20" fill="url(#modal)" stroke="#2d3f5e" stroke-width="1" filter="url(#sh)"/>

  <!-- Shield icon with amber glow -->
  <circle cx="320" cy="112" r="36" fill="#2d1f00" stroke="#92400e" stroke-width="1" filter="url(#glow)"/>
  <!-- Shield shape -->
  <path d="M320 90 L338 98 L338 113 C338 124 330 132 320 136 C310 132 302 124 302 113 L302 98 Z" fill="#f59e0b" opacity="0.25"/>
  <path d="M320 92 L336 99 L336 113 C336 123 329 130 320 134 C311 130 304 123 304 113 L304 99 Z" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <!-- Exclamation in shield -->
  <line x1="320" y1="104" x2="320" y2="118" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="320" cy="124" r="2" fill="#f59e0b"/>

  <!-- Header text -->
  <text x="320" y="162" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle">Account Not Activated</text>
  <text x="320" y="180" font-size="11" fill="#94a3b8" text-anchor="middle">This XRPL account needs 10 XRP</text>
  <text x="320" y="194" font-size="11" fill="#94a3b8" text-anchor="middle">reserve before it can transact.</text>
  <line x1="190" y1="208" x2="450" y2="208" stroke="#243047" stroke-width="1"/>

  <!-- QR placeholder -->
  <rect x="236" y="220" width="168" height="140" rx="10" fill="url(#qrbg)"/>
  <!-- QR pattern simulation -->
  <rect x="248" y="232" width="40" height="40" rx="3" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="254" y="238" width="28" height="28" rx="1" fill="#1e293b"/>
  <rect x="260" y="244" width="16" height="16" rx="1" fill="#f8fafc"/>
  <rect x="336" y="232" width="40" height="40" rx="3" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="342" y="238" width="28" height="28" rx="1" fill="#1e293b"/>
  <rect x="348" y="244" width="16" height="16" rx="1" fill="#f8fafc"/>
  <rect x="248" y="308" width="40" height="40" rx="3" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="254" y="314" width="28" height="28" rx="1" fill="#1e293b"/>
  <rect x="260" y="320" width="16" height="16" rx="1" fill="#f8fafc"/>
  <!-- Center QR dots -->
  <rect x="298" y="236" width="8" height="4" rx="1" fill="#334155" opacity="0.7"/>
  <rect x="310" y="240" width="6" height="6" rx="1" fill="#334155" opacity="0.7"/>
  <rect x="300" y="250" width="10" height="4" rx="1" fill="#334155" opacity="0.7"/>
  <rect x="296" y="258" width="14" height="4" rx="1" fill="#334155" opacity="0.7"/>
  <rect x="298" y="266" width="8" height="4" rx="1" fill="#334155" opacity="0.7"/>
  <rect x="308" y="274" width="10" height="4" rx="1" fill="#334155" opacity="0.7"/>
  <rect x="296" y="282" width="6" height="4" rx="1" fill="#334155" opacity="0.7"/>
  <rect x="306" y="290" width="12" height="4" rx="1" fill="#334155" opacity="0.7"/>
  <rect x="300" y="298" width="8" height="4" rx="1" fill="#334155" opacity="0.7"/>
  <text x="320" y="368" font-size="10" fill="#94a3b8" text-anchor="middle">Scan to send XRP reserve</text>

  <!-- Address row -->
  <rect x="190" y="376" width="260" height="34" rx="8" fill="#0f1929" stroke="#1e3354" stroke-width="1"/>
  <text x="210" y="398" font-size="10" fill="#64748b" font-family="monospace">rBKPS4oLSaV2KVVuHH8EpS…</text>
  <text x="434" y="398" font-size="10" fill="#3b82f6" text-anchor="end">Copy</text>

  <!-- Buttons -->
  <rect x="190" y="422" width="124" height="38" rx="10" fill="#f59e0b" opacity="0.15" stroke="#92400e" stroke-width="1"/>
  <text x="252" y="446" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">Get XRP →</text>

  <rect x="324" y="422" width="126" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="387" y="446" font-size="12" fill="#64748b" text-anchor="middle">Continue anyway</text>

  <!-- Close -->
  <circle cx="440" cy="74" r="13" fill="#243047"/>
  <text x="440" y="80" font-size="14" fill="#64748b" text-anchor="middle">✕</text>

  <!-- ANNOTATIONS LEFT -->
  <text x="16" y="90" font-size="10" fill="#f59e0b" font-weight="600">① SHIELD ICON</text>
  <text x="16" y="104" font-size="9.5" fill="#64748b">amber glow: 0 0 20px</text>
  <text x="16" y="117" font-size="9.5" fill="#64748b">#f59e0b opacity 0.4</text>
  <text x="16" y="130" font-size="9.5" fill="#64748b">pulse: scale 1→1.05 2s ease</text>
  <line x1="155" y1="108" x2="169" y2="112" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="16" y="250" font-size="10" fill="#f59e0b" font-weight="600">② QR CODE</text>
  <text x="16" y="264" font-size="9.5" fill="#64748b">fade-in 400ms delay 150ms</text>
  <text x="16" y="277" font-size="9.5" fill="#64748b">white bg cho readability</text>
  <text x="16" y="290" font-size="9.5" fill="#64748b">generated via qrcode lib</text>
  <line x1="155" y1="270" x2="169" y2="270" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>

  <text x="16" y="402" font-size="10" fill="#f59e0b" font-weight="600">③ ADDRESS ROW</text>
  <text x="16" y="416" font-size="9.5" fill="#64748b">tap → copy + toast confirm</text>
  <text x="16" y="429" font-size="9.5" fill="#64748b">monospace truncated display</text>
  <line x1="155" y1="393" x2="169" y2="393" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ANNOTATIONS RIGHT -->
  <text x="456" y="140" font-size="10" fill="#f59e0b" font-weight="600">④ PRIMARY CTA</text>
  <text x="456" y="154" font-size="9.5" fill="#64748b">"Get XRP" → opens</text>
  <text x="456" y="167" font-size="9.5" fill="#64748b">onramp/faucet link</text>
  <text x="456" y="180" font-size="9.5" fill="#64748b">amber outline style</text>

  <text x="456" y="210" font-size="10" fill="#f59e0b" font-weight="600">⑤ SKIP CTA</text>
  <text x="456" y="224" font-size="9.5" fill="#64748b">"Continue anyway"</text>
  <text x="456" y="237" font-size="9.5" fill="#64748b">muted — still allowed</text>
  <text x="456" y="250" font-size="9.5" fill="#64748b">emit "activation_skipped"</text>

  <!-- SPEC BOX -->
  <rect x="16" y="508" width="608" height="44" rx="8" fill="#0d1520" stroke="#1e293b" stroke-width="1"/>
  <text x="32" y="524" font-size="10" fill="#475569" font-weight="700" letter-spacing="0.8">INTEGRATION NOTE</text>
  <text x="32" y="540" font-size="10" fill="#94a3b8">Trigger: manager.on("connected") → check account.activated === false → show view "guard"  ·  onActivated callback khi balance ≥ 10 XRP</text>

  <rect x="504" y="544" width="120" height="16" rx="4" fill="#1e293b"/>
  <text x="564" y="556" font-size="9" fill="#475569" text-anchor="middle">FEATURE_UI_SPEC · P3-7</text>
</svg>
