<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#1e2d47"/>
    </linearGradient>
    <linearGradient id="ts" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f2e1f"/>
    </linearGradient>
    <linearGradient id="tf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#2d1515"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <text x="28" y="36" font-size="11" fill="#64748b" font-weight="500" letter-spacing="1.5">WALLET TOAST NOTIFICATIONS</text>
  <line x1="28" y1="44" x2="612" y2="44" stroke="#1e293b" stroke-width="1"/>

  <!-- TOAST 1 PENDING -->
  <rect x="280" y="62" width="332" height="76" rx="14" fill="url(#tp)" stroke="#3b5280" stroke-width="1" filter="url(#sh)"/>
  <rect x="280" y="62" width="4" height="76" rx="2" fill="#3b82f6"/>
  <circle cx="316" cy="100" r="13" fill="none" stroke="#1e3a5f" stroke-width="2.5"/>
  <path d="M316 87 A13 13 0 0 1 329 100" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="342" y="90" font-size="13" font-weight="600" fill="#e2e8f0">Transaction Pending</text>
  <text x="342" y="108" font-size="11.5" fill="#94a3b8">Sending 50 XRP to rPT1…3kXa</text>
  <text x="342" y="125" font-size="11" fill="#60a5fa">View on explorer →</text>
  <text x="596" y="97" font-size="15" fill="#475569">✕</text>
  <text x="28" y="80" font-size="10" fill="#3b82f6" font-weight="600">① PENDING STATE</text>
  <text x="28" y="95" font-size="10" fill="#64748b">Spinner: rotate(360deg) 1s linear infinite</text>
  <text x="28" y="109" font-size="10" fill="#64748b">Enter: slideInRight 280ms spring</text>
  <text x="28" y="123" font-size="10" fill="#64748b">Auto-dismiss: manual only</text>
  <line x1="265" y1="100" x2="279" y2="100" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- TOAST 2 CONFIRMED -->
  <rect x="280" y="156" width="332" height="76" rx="14" fill="url(#ts)" stroke="#15503a" stroke-width="1" filter="url(#sh)"/>
  <rect x="280" y="156" width="4" height="76" rx="2" fill="#10b981"/>
  <circle cx="316" cy="194" r="13" fill="#10b981" opacity="0.15"/>
  <circle cx="316" cy="194" r="10" fill="none" stroke="#10b981" stroke-width="2"/>
  <polyline points="310,194 314,199 323,188" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="342" y="184" font-size="13" font-weight="600" fill="#e2e8f0">Transaction Confirmed</text>
  <text x="342" y="202" font-size="11.5" fill="#94a3b8">50 XRP sent successfully · 2s ago</text>
  <text x="342" y="219" font-size="11" fill="#34d399">View on explorer →</text>
  <text x="596" y="191" font-size="15" fill="#475569">✕</text>
  <text x="28" y="174" font-size="10" fill="#10b981" font-weight="600">② CONFIRMED STATE</text>
  <text x="28" y="189" font-size="10" fill="#64748b">Check icon: scale(0→1) pulse 300ms ease-out</text>
  <text x="28" y="203" font-size="10" fill="#64748b">Progress bar đếm ngược 6s (bottom edge)</text>
  <text x="28" y="217" font-size="10" fill="#64748b">Auto-dismiss: 6 000ms</text>
  <line x1="265" y1="194" x2="279" y2="194" stroke="#10b981" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- TOAST 3 FAILED -->
  <rect x="280" y="250" width="332" height="76" rx="14" fill="url(#tf)" stroke="#5a2020" stroke-width="1" filter="url(#sh)"/>
  <rect x="280" y="250" width="4" height="76" rx="2" fill="#ef4444"/>
  <circle cx="316" cy="288" r="13" fill="#ef4444" opacity="0.12"/>
  <circle cx="316" cy="288" r="10" fill="none" stroke="#ef4444" stroke-width="2"/>
  <line x1="316" y1="282" x2="316" y2="291" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="316" cy="295" r="1.5" fill="#ef4444"/>
  <text x="342" y="278" font-size="13" font-weight="600" fill="#e2e8f0">Transaction Failed</text>
  <text x="342" y="296" font-size="11.5" fill="#94a3b8">tecNO_DST_INSUF_XRP · Fee: 12 drops</text>
  <text x="342" y="313" font-size="11" fill="#f87171">Retry →</text>
  <text x="596" y="285" font-size="15" fill="#475569">✕</text>
  <text x="28" y="268" font-size="10" fill="#ef4444" font-weight="600">③ FAILED STATE</text>
  <text x="28" y="283" font-size="10" fill="#64748b">Shake: translateX ±6px 0.4s ease-in-out</text>
  <text x="28" y="297" font-size="10" fill="#64748b">Error code hiển thị đầy đủ từ TxResult</text>
  <text x="28" y="311" font-size="10" fill="#64748b">Auto-dismiss: 10 000ms</text>
  <line x1="265" y1="288" x2="279" y2="288" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- PROGRESS BAR DEMO -->
  <rect x="280" y="219" width="332" height="3" rx="1.5" fill="#1e293b"/>
  <rect x="280" y="219" width="200" height="3" rx="1.5" fill="#10b981" opacity="0.5"/>
  <text x="280" y="236" font-size="9" fill="#334155" font-style="italic">← progress bar countdown (6s)</text>

  <!-- ANIMATION SPEC BOX -->
  <rect x="28" y="348" width="584" height="108" rx="10" fill="#0d1520" stroke="#1e293b" stroke-width="1"/>
  <text x="44" y="368" font-size="10" fill="#475569" font-weight="700" letter-spacing="1">ANIMATION &amp; BEHAVIOR SPEC</text>
  <text x="44" y="386" font-size="10.5" fill="#94a3b8">Enter    </text><text x="90" y="386" font-size="10.5" fill="#e2e8f0">translateX(110%) → 0  ·  280ms  ·  cubic-bezier(0.34, 1.56, 0.64, 1)  [spring bounce]</text>
  <text x="44" y="402" font-size="10.5" fill="#94a3b8">Exit     </text><text x="90" y="402" font-size="10.5" fill="#e2e8f0">translateX(0) → 110% + opacity 1→0  ·  220ms  ·  ease-in</text>
  <text x="44" y="418" font-size="10.5" fill="#94a3b8">Stack    </text><text x="90" y="418" font-size="10.5" fill="#e2e8f0">max 3 visible  ·  gap 10px  ·  position: fixed bottom-right  ·  z-index: 9999</text>
  <text x="44" y="434" font-size="10.5" fill="#94a3b8">Swipe    </text><text x="90" y="434" font-size="10.5" fill="#e2e8f0">touch swipe-right → dismiss  ·  velocity threshold 200px/s</text>
  <text x="44" y="450" font-size="10.5" fill="#94a3b8">A11y     </text><text x="90" y="450" font-size="10.5" fill="#e2e8f0">role="status" aria-live="polite"  ·  pending dùng aria-live="assertive"</text>

  <rect x="508" y="452" width="100" height="18" rx="4" fill="#1e293b"/>
  <text x="558" y="465" font-size="9" fill="#475569" text-anchor="middle">xwk-wallet-kit · ui</text>
</svg>
