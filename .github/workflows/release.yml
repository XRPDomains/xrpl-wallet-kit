name: Coordinated release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages and create a GitHub release
        required: true
        type: boolean
        default: false
      test_scope:
        description: Regression coverage for this release
        required: true
        type: choice
        default: full
        options:
          - full
          - ghostsig

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify npm credentials before publishing
        if: ${{ inputs.publish }}
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm ci
      - run: npm run build:browser
      - name: Full regression tests
        if: ${{ inputs.test_scope != 'ghostsig' }}
        run: node --import tsx --test tests/*.test.ts
      - name: Focused GhostSig regression tests
        if: ${{ inputs.test_scope == 'ghostsig' }}
        run: node --import tsx --test tests/ghostsig.test.ts
      - run: npm run smoke:release
      - run: npm --prefix website ci
      - run: npm --prefix website run build
      - name: Publish all public workspaces
        if: ${{ inputs.publish }}
        run: |
          npm publish --workspace @xrpl-wallet-kit/core --access public
          npm publish --workspace @xrpl-wallet-kit/xahau --access public
          npm publish --workspace @xrpl-wallet-kit/adapter-crossmark --access public
          npm publish --workspace @xrpl-wallet-kit/adapter-dropfi --access public
          npm publish --workspace @xrpl-wallet-kit/adapter-ghostsig --access public
          npm publish --workspace @xrpl-wallet-kit/adapter-gemwallet --access public
          npm publish --workspace @xrpl-wallet-kit/adapter-ledger --access public
          npm publish --workspace @xrpl-wallet-kit/adapter-otsu --access public
          npm publish --workspace @xrpl-wallet-kit/adapter-walletconnect --access public
          npm publish --workspace @xrpl-wallet-kit/adapter-xaman --access public
          npm publish --workspace @xrpl-wallet-kit/adapter-xrpl-snap --access public
          npm publish --workspace @xrpl-wallet-kit/adapter-xyra --access public
          npm publish --workspace @xrpl-wallet-kit/auth --access public
          npm publish --workspace @xrpl-wallet-kit/ui --access public
          npm publish --workspace @xrpl-wallet-kit/react --access public
          npm publish --workspace @xrpl-wallet-kit/vue --access public
          npm publish --workspace @xrpl-wallet-kit/next --access public
          npm publish --workspace @xrpl-wallet-kit/client --access public
          npm publish --workspace @xrpl-wallet-kit/browser --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --notes-file "docs/releases/v${VERSION}.md" --generate-notes --verify-tag
