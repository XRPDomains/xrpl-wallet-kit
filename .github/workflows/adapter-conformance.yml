name: Adapter conformance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --import tsx --test tests/adapter-conformance.test.ts
